name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Lint with flake8
      run: poetry run flake8 src/

    - name: Security scan with bandit
      run: poetry run bandit -r src/ -ll

    - name: Check complexity with radon
      run: |
        poetry run radon cc -a -s src/
        poetry run radon mi -s src/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-security

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run tests (if any)
      run: |
        # Проверяем, есть ли тесты
        if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' -type f | wc -l)" -gt 0 ]; then
          poetry run pytest tests/ --cov=src --cov-report=term-missing
        else
          echo "No tests found yet. Skipping..."
        fi
