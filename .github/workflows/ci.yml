name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Lint with flake8
      run: poetry run flake8 src/

    - name: Security scan with bandit
      run: poetry run bandit -r src/ -ll

    - name: Check complexity with radon
      run: |
        poetry run radon cc -a -s -n B src/
        poetry run radon mi -s src/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-security

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Create data directory
      run: mkdir -p data

    - name: Run tests with coverage
      run: |
        poetry run pytest tests/unit --cov=src --cov-report=term-missing -v --cov-fail-under=50
        poetry run pytest tests/streamlit --cov=src --cov-report=term-missing -v --cov-fail-under=50
        poetry run pytest tests/integration --cov=src --cov-report=term-missing -v --cov-fail-under=50
      env:
        DATABASE_PATH: ${{ github.workspace }}/data/test_deliverinno.db

  e2e-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: [lint-and-security, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create data directory
        run: mkdir -p data

      - name: Run E2E tests
        run: poetry run pytest tests/e2e --cov=src --cov-report=term-missing -v --cov-fail-under=50
        env:
          DATABASE_PATH: ${{ github.workspace }}/data/test_deliverinno.db
