[tool.poetry]
name = "deliverinno"
version = "0.1.0"
description = "Delivery web application with FastAPI and Streamlit"
authors = [
    "Sofia Palkina <s.palkina@innopolis.university>",
    "Amir Bairamov <a.bairamov@innopolis.university>",
    "Polina Kostikova <p.kostikova@innopolis.university>",
    "Bulat Gazizov <b.gazizov@innopolis.university>"
]
packages = [{include = "src"}]
package-mode = true

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
streamlit = "^1.29.0"
sqlalchemy = "^2.0.0"
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^4.1.0"
flake8 = "^6.1.0"
bandit = "^1.7.0"
radon = "^6.0.0"
pre-commit = "^3.5.0"
httpx = "^0.25.0"
locust = "^2.43.4"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
